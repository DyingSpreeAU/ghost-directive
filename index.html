<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ghost Directive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Registers the bug report form with Netlify Forms; the app posts to it (src/BugReport.tsx). -->
    <form name="bug-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><textarea name="what"></textarea><textarea name="expected"></textarea><input name="contact" />
      <input name="page" /><input name="role" /><input name="channel" /><input name="version" /><input name="bungie" /><input name="browser" /><input name="screen" /><input name="at" /><textarea name="data"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
